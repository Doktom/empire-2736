<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire 2736</title>
<meta name="description" content="Jeu de gestion économique cynique : un descendant de Napoléon veut racheter la France aux mégacorporations en 2736.">
<style>
:root{--bg:#f3ead2;--card:#fffaf0;--ink:#1b2240;--mute:#666b84;--blue:#1e40af;--blue2:#dbe4ff;--red:#d2323c;--red2:#ffe0e2;--gold:#c8921a;--gold2:#fff0c4;--green:#16825a;--green2:#d9f5e7;--line:#1b2240;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:radial-gradient(#e0d4b3 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:84px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stripe{height:8px;background:linear-gradient(90deg,var(--blue) 33%,#fff 33% 66%,var(--red) 66%);border-bottom:2px solid var(--ink)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.fleur{font-size:34px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.brand h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;line-height:1}
.brand small{color:var(--mute)}
.prog{flex:1;min-width:180px}
.progtxt{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:3px}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s}
.hbtns{display:flex;gap:8px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:0 16px 16px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:12px}
.card.own{background:var(--gold2);border-color:var(--gold);box-shadow:4px 4px 0 var(--gold)}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800}
.card .sub{color:var(--mute);font-size:13px;margin-bottom:8px}
.side{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:8px}
@media(max-width:860px){.side{position:static}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff}
.tile.wide{grid-column:1/3}
.tile b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.tile span{font-size:21px;font-weight:800}
.tile small{display:block;font-size:12px;color:var(--mute)}
.pos{color:var(--green)}.neg{color:var(--red)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid var(--ink);background:#fff}
.pill.red{background:var(--red2);color:var(--red);border-color:var(--red)}
.pill.gold{background:var(--gold2);color:#7a5600;border-color:var(--gold)}
.pill.blue{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.pill.green{background:var(--green2);color:var(--green);border-color:var(--green)}
.advisor{display:flex;gap:10px;align-items:center;background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;margin-bottom:12px}
.advisor .av{font-size:28px}
.advisor button{margin-left:auto;white-space:nowrap}
.news{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.news h4{margin:0 0 3px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
.news p{margin:3px 0;font-style:italic}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.w{background:#fff;color:var(--ink)}
.btn.r{background:var(--red)}
.btn.g{background:var(--gold);color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.big{font-size:18px;padding:10px 22px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button.p{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.seg button.p.on{background:var(--ink);color:var(--bg)}
.small{font-size:12.5px;color:var(--mute)}
.need{font-size:12px;color:var(--red);font-weight:600}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--ink);padding:10px 16px;display:flex;justify-content:center;gap:16px;align-items:center;z-index:5;flex-wrap:wrap}
.bottom .hint{font-size:14px}
.ov{position:fixed;inset:0;background:rgba(27,34,64,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;overflow:auto}
.modal{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);max-width:560px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:22px;font-weight:900}
.modal .opt{display:block;width:100%;text-align:left;margin-top:8px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:700}
.modal .opt:hover{background:var(--blue2)}
.modal .opt small{display:block;color:var(--mute);font-weight:400}
.big-icon{font-size:56px;line-height:1}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--ink)}
.diff{display:grid;gap:8px;margin:10px 0}
.diff button{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.diff button.on{background:var(--gold2);border-color:var(--gold);box-shadow:3px 3px 0 var(--gold)}
.diff b{display:block}
.log p{margin:3px 0;border-bottom:1px dotted #c9bd9a;padding-bottom:3px}
.log .t{display:inline-block;min-width:34px;font-weight:800;color:var(--blue)}
.mis{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted #c9bd9a}
.mis .ck{font-size:18px}
.mis.done{opacity:.55;text-decoration:line-through}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-weight:600;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.flash{animation:fl .6s}
@keyframes fl{0%{background:var(--gold2)}100%{background:transparent}}
@media(max-width:560px){.brand h1{font-size:20px}.top{padding:8px 10px}.layout{padding:0 10px 10px}}
</style>
</head>
<body>
<div class="stripe"></div>
<header class="top">
  <div class="brand"><span class="fleur">⚜</span><div><h1>EMPIRE 2736</h1><small>Racheter la France, un trimestre à la fois</small></div></div>
  <div class="prog"><div class="progtxt"><span id="progtxt"></span><span id="progprov"></span></div><div class="bar"><i id="progbar" style="background:var(--blue)"></i></div></div>
  <div class="hbtns"><button class="btn w sm" onclick="showMissions()">🎯 Missions</button><button class="btn w sm" onclick="showHelp()">❓ Aide</button><button class="btn w sm" onclick="showMenu()">☰</button></div>
</header>
<main class="layout">
  <aside class="side" id="side"></aside>
  <section>
    <div id="advisor"></div>
    <div id="news"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="panel"></div>
  </section>
</main>
<div class="bottom"><div class="hint" id="gohint"></div><button class="btn big" id="endbtn" onclick="endTurn()">Clore le trimestre ▶</button></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
const MAX = 40;
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const num = n => Math.round(n).toLocaleString('fr-FR');
const money = n => num(n) + ' ⚜';
const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
const sgn = n => (n >= 0 ? '+' : '−') + num(Math.abs(n));
const SAVE_KEY = 'empire2736-save', BEST_KEY = 'empire2736-best', TUTO_KEY = 'empire2736-tuto';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { } };

/* ---------- Données ---------- */
const DIFF = {
  easy: { n: '🌱 Page blanche', cash: 5000, heat: .7, ev: .55, d: 'Plus de trésor au départ, moins de suspicion, moins d\'imprévus. Pour apprendre.' },
  normal: { n: '⚔ Consul', cash: 3000, heat: 1, ev: .7, d: 'L\'expérience prévue. Équilibrée, cynique, juste.' },
  hard: { n: '💀 Waterloo', cash: 2000, heat: 1.3, ev: .85, d: 'Peu d\'argent, le Conseil vous surveille de près, les catastrophes s\'enchaînent.' },
};
const BIZ = [
  { id: 'lithium', icon: '⛏', name: 'Mines de Lithium de Marengo', cost: 1500, inc: 230, flav: 'Rentable, bruyante, sujette à la surchauffe.' },
  { id: 'cafe', icon: '☕', name: 'Cafés Synthétiques « Le Grognard »', cost: 2500, inc: 300, flav: 'Le café n\'a jamais vu un grain. Les clients non plus.' },
  { id: 'drones', icon: '🤖', name: 'Manufacture de Drones de la Vieille Garde', cost: 3000, inc: 400, flav: 'Ils meurent en chantant. Surchauffe fréquente.' },
  { id: 'legit', icon: '📜', name: 'Ministère de la Légitimité', cost: 4000, inc: 150, flav: 'Produit des généalogies et des regrets. Radar −4 par niveau.' },
  { id: 'orbitales', icon: '🛰', name: 'Régie Publicitaire Orbitale', cost: 5000, inc: 650, flav: 'Des panneaux dans le ciel. Recettes capricieuses.' },
  { id: 'nanobrume', icon: '🌫', name: 'Usine de Nano-Brume Sociale', cost: 8000, inc: 1100, flav: 'Très lucratif. Les riverains rient sans raison. Radar +1 par niveau.' },
];
const EXPLO = ['lithium', 'drones', 'nanobrume'];
const PROV = [
  { id: 'corse', name: 'Corse', cost: 3000, inc: 120, flav: 'Le berceau de la dynastie. Reconverti en parc à thème « Napoléon™ ».' },
  { id: 'normandie', name: 'Normandie', cost: 5000, inc: 250, flav: 'Plages du Débarquement, sponsorisées par une marque de boisson.' },
  { id: 'provence', name: 'Provence', cost: 6500, inc: 300, flav: 'Les cigales sont sous licence. Elles chantent en 4 langues.' },
  { id: 'bretagne', name: 'Bretagne', cost: 8000, inc: 380, flav: 'Résiste encore, mais accepte désormais les cartes de crédit.' },
  { id: 'idf', name: 'Île-de-France', cost: 10000, inc: 500, flav: 'Siège de 11 corporations. La Tour Eiffel est un support publicitaire.' },
  { id: 'alsace', name: 'Alsace-Lorraine', cost: 12000, inc: 600, flav: 'Réclamée par tout le monde, une fois de plus. Zone logistique.' },
  { id: 'aquitaine', name: 'Aquitaine', cost: 14000, inc: 700, flav: 'Le vin y est devenu un produit financier. Il est excellent, hélas.' },
  { id: 'alpes', name: 'Rhône-Alpes', cost: 17000, inc: 850, flav: 'Stations de ski sous dôme climatisé. La neige est un abonnement.' },
];
const STK = [
  { id: 'VOLT', name: 'Voltaire Énergie Inc.', sec: 'Énergie', p: 20, vol: .06, div: .012, risk: 'moyen', desc: 'Vend des électrons au détail, des éclairs en gros.' },
  { id: 'GRND', name: 'Grognard Dynamics', sec: 'Défense', p: 35, vol: .05, div: .010, risk: 'moyen', desc: 'Fabrique des robots qui obéissent. Parfois.' },
  { id: 'ORBI', name: 'Orbital Logistics', sec: 'Transport', p: 15, vol: .09, div: .005, risk: 'élevé', desc: 'Livraison en 1 jour, ou en 40 ans.' },
  { id: 'CAFE', name: 'Café-Corp Universel', sec: 'Conso', p: 40, vol: .035, div: .015, risk: 'faible', desc: 'Valeur refuge. Contient 12 % de café.' },
  { id: 'NEBU', name: 'Nébuleuse Futures', sec: 'Spéculatif', p: 8, vol: .16, div: 0, risk: 'très élevé', desc: 'Aucun produit. Valorisation astronomique. Au sens propre.' },
  { id: 'PARD', name: 'Pardon™ Relations Publiques', sec: 'Services', p: 25, vol: .05, div: .010, risk: 'moyen', desc: 'Désolé. Pas désolé. Facturé à l\'heure.' },
];
const WAGE = [
  { n: 'Zéro-heure', m: 1.18, d: '+18 % de recettes · grèves fréquentes · Radar +1/trim.' },
  { n: 'Standard', m: 1, d: 'Rien à signaler. Ce qui est déjà louche.' },
  { n: 'Bien-être', m: .9, d: '−10 % de recettes · aucune grève · Radar −1/trim. (Massage + chaise.)' },
];
const WSTRIKE = [.15, .04, 0];
const SAFE = [
  { n: '« Ta chance »', cost: 0, p: .10, d: 'Gratuit. ~10 % de surchauffe par trim. et par site sensible.' },
  { n: 'Casque en carton', cost: 150, p: .04, d: '150 ⚜/trim. ~4 % de surchauffe.' },
  { n: 'IA qui fait peur', cost: 500, p: .01, d: '500 ⚜/trim. ~1 % de surchauffe.' },
];
const DEC = [
  { id: 'code', icon: '📜', name: 'Code Civil 2.0', cost: 6, d: 'Le Radar baisse de 2 de plus chaque trimestre.' },
  { id: 'armee', icon: '🤖', name: 'Grande Armée de Drones', cost: 8, d: '+10 % de revenus sur toutes vos activités.' },
  { id: 'legion', icon: '🎖', name: 'Légion d\'Honneur™', cost: 6, d: 'Vos dividendes sont doublés.' },
  { id: 'blocus', icon: '🛡', name: 'Blocus Continental', cost: 8, d: 'Les mauvaises nouvelles boursières font deux fois moins mal.' },
  { id: 'noir', icon: '🕴', name: 'Cabinet Noir', cost: 10, d: '5 pots-de-vin par trimestre (au lieu de 3), rumeurs et infos d\'initié 1/3 moins chères.' },
  { id: 'banque', icon: '🏦', name: 'Banque Impériale', cost: 7, d: 'Intérêts −40 % et plafond d\'emprunt +30 %.' },
];
const MIS = [
  { id: 'm1', t: 'Fonder une activité (onglet Corporation)', ok: () => totalLevels() > 0, r: { cash: 300 } },
  { id: 'm2', t: 'Acheter des actions (onglet Bourse)', ok: () => G.stocks.some(s => s.held > 0), r: { cash: 200, glory: 1 } },
  { id: 'm3', t: 'Clore ton premier trimestre', ok: () => G.turn >= 2, r: { glory: 1 } },
  { id: 'm4', t: 'Améliorer une activité au niveau 2', ok: () => G.biz.some(b => b.level >= 2), r: { cash: 300, glory: 1 } },
  { id: 'm5', t: 'Gagner 1 000 ⚜ nets en un seul trimestre', ok: () => G.lastNet >= 1000, r: { glory: 2 } },
  { id: 'm6', t: 'Racheter la Corse (onglet Reconquête)', ok: () => G.prov[0], r: { cash: 500, glory: 3 } },
  { id: 'm7', t: 'Promulguer ton premier décret impérial', ok: () => Object.keys(G.dec).length > 0, r: { glory: 2 } },
  { id: 'm8', t: 'Atteindre 25 000 ⚜ de patrimoine', ok: () => netWorth() >= 25000, r: { glory: 3 } },
  { id: 'm9', t: 'Racheter 4 provinces', ok: () => G.prov.filter(Boolean).length >= 4, r: { cash: 2000, glory: 4 } },
  { id: 'm10', t: 'Atteindre 80 000 ⚜ de patrimoine', ok: () => netWorth() >= 80000, r: { glory: 5 } },
];
const UP = [
  s => `Fuite de l'Imperial Feed™ : « ${s.name} aurait le vent en poupe. »`,
  s => `Un stagiaire en pleurs jure que ${s.name} « va faire des étincelles ».`,
  s => `On murmure que ${s.name} a trouvé un nouveau marché : vous.`,
];
const DOWN = [
  s => `Un lanceur d'alerte (déjà licencié) affirme que ${s.name} « sent le roussi ».`,
  s => `Rumeur : le directeur financier de ${s.name} aurait pris une navette pour Mars.`,
  s => `Les actionnaires de ${s.name} transpirent. Du liquide de refroidissement, probablement.`,
];
const FLUFF = [
  'Le Conseil Mondial annonce que la crise n\'existe pas. Les économistes sont priés d\'être d\'accord.',
  'Un PDG déclare que la pauvreté est « un abonnement non renouvelé ».',
  'Étude : 9 mégacorporations sur 10 se disent « modérément éthiques ». La dixième ment.',
  'Nouvelle loi : la démocratie passe en version Premium. Les non-abonnés peuvent observer.',
  'Sondage : 87 % des Français ne savent plus qu\'il y a eu un Empire. 13 % pensent que c\'est une marque de lessive.',
];
const TUTO = [
  { i: '⚜', t: 'Bienvenue, Sire', x: 'An 2736. Les mégacorporations possèdent tout, y compris la France. Vous êtes Napoléon Bonaparte-Dupont, 19e du nom, et vous voulez la racheter. <b>Objectif : racheter les 8 provinces</b> en 40 trimestres, sans finir en prison ni en faillite.' },
  { i: '🏭', t: 'Gagner des ⚜', x: 'Dans l\'onglet <b>Corporation</b>, construisez des activités et améliorez-les. Elles rapportent des ⚜ à chaque fin de trimestre. Les moins chères sont les plus rentables au début.' },
  { i: '📈', t: 'Investir en Bourse', x: 'Achetez des actions pas chères, revendez-les plus cher, encaissez des dividendes. L\'<b>Imperial Feed™</b> donne des indices sur les cours à venir… mais 1 sur 5 est faux. Les rumeurs et infos d\'initié sont possibles, mais risquées.' },
  { i: '📡', t: 'Le Radar du Conseil', x: 'Chaque manœuvre douteuse fait monter le <b>Radar</b>. À 100 : procès et amende. Au deuxième procès : exil sur une station orbitale, fin de partie. Surveillez la jauge à gauche.' },
  { i: '▶', t: 'Clore le trimestre', x: 'Quand vous avez fini vos achats, appuyez sur <b>Clore le trimestre</b> (ou la touche <b>Espace</b>). Le conseiller bleu vous suggère toujours la prochaine étape, et les <b>Missions</b> vous guident au début.' },
];

let G;

/* ---------- Helpers d'état ---------- */
const st = id => G.stocks.find(s => s.id === id);
const bz = id => G.biz.find(b => b.id === id);
const bdef = id => BIZ.find(b => b.id === id);
const owned = id => bz(id).level > 0;
const totalLevels = () => G.biz.reduce((a, b) => a + b.level, 0);
const stockValue = () => G.stocks.reduce((a, s) => a + s.held * s.price, 0);
const bizValue = () => G.biz.reduce((a, b) => a + b.inv * .6, 0);
const provValue = () => PROV.reduce((a, p, i) => G.prov[i] ? a + p.cost * .7 : a, 0);
const provIncome = () => PROV.reduce((a, p, i) => G.prov[i] ? a + p.inc : a, 0);
const assets = () => Math.max(0, G.cash) + stockValue() + bizValue() + provValue();
const netWorth = () => G.cash + stockValue() + bizValue() + provValue() - G.debt;
const borrowLimit = () => Math.round((3000 + .6 * assets()) * (G.dec.banque ? 1.3 : 1));
const rate = () => G.rate * (G.dec.banque ? .6 : 1);
const inflMax = () => G.dec.noir ? 5 : 3;
const rumorCost = () => G.dec.noir ? 200 : 300;
const tipCost = () => G.dec.noir ? 270 : 400;
const bizIncome = (b, lvl = b.level) => bdef(b.id).inc * Math.pow(lvl, .85) * WAGE[G.wage].m * (G.dec.armee ? 1.1 : 1);
const expIncome = () => G.biz.reduce((a, b) => b.level && !b.down ? a + bizIncome(b) : a, 0) + provIncome();
const expNet = () => expIncome() - SAFE[G.safety].cost - G.debt * rate();
const logMsg = t => { G.log.unshift({ turn: Math.min(G.turn, MAX), t }); if (G.log.length > 80) G.log.pop(); };
const addHeat = n => { G.heat = Math.max(0, Math.min(120, G.heat + (n > 0 ? n * DIFF[G.diff].heat : n))); };
let toastT;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }
function shock(id, p) { if (p < 0 && G.dec.blocus) p *= .5; const s = st(id); s.price = Math.max(1, s.price * (1 + p)); s.fair *= 1 + p * .4; s.hist[s.hist.length - 1] = s.price; }
function randOwned() { const o = G.biz.filter(b => b.level > 0); return o.length ? pick(o) : null; }
function bizCost(i) {
  const d = BIZ[i], b = G.biz[i];
  const c = b.level === 0 ? d.cost : Math.round(d.cost * .9 * b.level);
  return G.deal && G.deal.i === i ? Math.round(c * (1 - G.deal.disc)) : c;
}
const missing = c => c > G.cash ? `<div class="need">Il manque ${money(c - G.cash)}</div>` : '';

/* ---------- Nouvelle partie / sauvegarde ---------- */
function newGame(diff = 'normal') {
  G = {
    diff, turn: 1, cash: DIFF[diff].cash, debt: 0, heat: 5, strikes: 0, infl: 3, wage: 1, safety: 0, rate: .04, rateT: 0, glory: 0,
    stocks: STK.map(s => ({ id: s.id, price: s.p, fair: s.p, hist: [s.p], held: 0, cost: 0 })),
    biz: BIZ.map(b => ({ id: b.id, level: 0, down: 0, inv: 0 })),
    prov: PROV.map(() => false), dec: {}, mis: {}, deal: null, qty: 10, man: {}, report: null, lastNet: 0,
    log: [], pending: {}, tips: {}, heads: [], queue: [], nwHist: [], gameover: null, lastEv: null, tab: 'empire',
  };
  prerollNews();
  G.nwHist.push(netWorth());
  logMsg('An 2736. Les mégacorporations ont acheté les États, les nuages et le mot « liberté ». Vous avez un bicorne ancestral, un trésor et un plan : racheter la France, province par province.');
  closeModal();
  render();
}
function saveGame() { if (!G.gameover && !G.queue.length) lsSet(SAVE_KEY, JSON.stringify(G)); }
function loadGame() {
  try { const s = JSON.parse(lsGet(SAVE_KEY)); if (!s || !s.stocks) return false; G = s; G.queue = []; return true; } catch (e) { return false; }
}
function prerollNews() {
  G.pending = {}; G.heads = []; G.tips = {};
  STK.forEach(s => {
    if (Math.random() < .33) {
      const m = (Math.random() < .5 ? -1 : 1) * rnd(.04, .14);
      G.pending[s.id] = m;
      if (Math.random() < .55) {
        const lie = Math.random() < .2;
        G.heads.push({ s: s.id, up: (m > 0) !== lie, t: pick((m > 0) !== lie ? UP : DOWN)(s) });
      }
    }
  });
  if (G.heads.length < 2) G.heads.push({ t: pick(FLUFF) });
  G.deal = null;
  if (Math.random() < .6) { const c = G.biz.map((b, i) => i).filter(i => G.biz[i].level < 5); if (c.length) G.deal = { i: pick(c), disc: .25 }; }
}

/* ---------- Actions joueur ---------- */
function setQty(q) { G.qty = q; render(); }
function buy(id) {
  const s = st(id);
  let n = G.qty === 'max' ? Math.floor(G.cash / (s.price * 1.01)) : G.qty;
  if (n <= 0) return toast('Fonds insuffisants');
  const c = s.price * n * 1.01;
  if (c > G.cash) { n = Math.floor(G.cash / (s.price * 1.01)); if (n <= 0) return toast('Fonds insuffisants'); toast(`Fonds limités : achat de ${n} au lieu de ${G.qty}`); }
  s.cost = (s.cost * s.held + s.price * n) / (s.held + n);
  G.cash -= s.price * n * 1.01; s.held += n; render();
}
function sell(id) {
  const s = st(id);
  let n = G.qty === 'max' ? s.held : Math.min(G.qty, s.held);
  if (n <= 0) return;
  G.cash += s.price * n * .99; s.held -= n; if (!s.held) s.cost = 0; render();
}
function toggleMan(id) { G.man[id] = !G.man[id]; render(); }
function rumor(id, dir) {
  if (G.infl < 1) return toast('Plus de pots-de-vin ce trimestre');
  if (G.cash < rumorCost()) return toast('Fonds insuffisants');
  G.cash -= rumorCost(); G.infl--; addHeat(6);
  G.pending[id] = (G.pending[id] || 0) + dir * rnd(.08, .14);
  logMsg(`Vous arrosez un influenceur : ${id} sera ${dir > 0 ? 'porté aux nues' : 'traîné dans la boue'}. (−${rumorCost()}, Radar +6)`);
  toast(dir > 0 ? `Rumeur flatteuse lancée sur ${id}` : `Calomnie lancée sur ${id}`);
  render();
}
function tip(id) {
  if (G.infl < 1) return toast('Plus de pots-de-vin ce trimestre');
  if (G.cash < tipCost()) return toast('Fonds insuffisants');
  G.cash -= tipCost(); G.infl--; addHeat(5); G.tips[id] = G.pending[id] || 0;
  logMsg(`Un cadre sup' en burn-out vous vend une info d'initié sur ${id}. (−${tipCost()}, Radar +5)`);
  render();
}
function buyBiz(i) {
  const b = G.biz[i], c = bizCost(i);
  if (b.level >= 5) return;
  if (c > G.cash) return toast('Fonds insuffisants');
  G.cash -= c; b.inv += c; b.level++;
  logMsg(b.level === 1 ? `Inauguration : ${BIZ[i].name}. Ruban coupé, employés non rémunérés.` : `${BIZ[i].name} passe au niveau ${b.level}. Plus de profits, moins de scrupules.`);
  toast(b.level === 1 ? `${BIZ[i].icon} Activité fondée !` : `${BIZ[i].icon} Niveau ${b.level} !`);
  render();
}
function buyProv(i) {
  if (G.prov[i]) return;
  const p = PROV[i];
  if (p.cost > G.cash) return toast('Fonds insuffisants');
  G.cash -= p.cost; G.prov[i] = true; addHeat(8);
  logMsg(`🇫🇷 Rachat de ${p.name} au Conseil des Corporations. Elles n'aiment pas qu'on touche à leurs parkings. (Radar +8)`);
  toast(`🇫🇷 ${p.name} reconquise !`);
  if (G.prov.every(Boolean)) {
    G.gameover = { win: true, title: '👑 LE SACRE', text: 'Les huit provinces sont à vous. Vous vous couronnez vous-même, dans une cathédrale sponsorisée, devant 3 milliards de spectateurs (dont 2,9 milliards de bots). Le Conseil des Corporations applaudit poliment : vous êtes désormais leur meilleur client.' };
    return showEnd();
  }
  render();
}
function buyDec(id) {
  const d = DEC.find(x => x.id === id);
  if (G.dec[id]) return;
  if (G.glory < d.cost) return toast('Pas assez de Gloire');
  G.glory -= d.cost; G.dec[id] = true;
  logMsg(`📜 Décret impérial : ${d.name}. Personne n'a voté, c'est l'avantage.`);
  toast(`${d.icon} Décret promulgué !`);
  render();
}
function setWage(i) { G.wage = i; render(); }
function setSafe(i) { G.safety = i; render(); }
function borrow(n) {
  const room = borrowLimit() - G.debt;
  n = Math.min(n, room); if (n <= 0) return toast('Le banquier secoue la tête : plafond atteint.');
  G.debt += n; G.cash += n; render();
}
function repay(n) {
  if (n === 'all') n = G.debt;
  n = Math.min(n, G.debt, Math.max(0, G.cash)); if (n <= 0) return toast('Rien à rembourser (ou pas de quoi).');
  G.debt -= n; G.cash -= n; render();
}
function lawyer() {
  if (G.cash < 800) return toast('Fonds insuffisants');
  G.cash -= 800; addHeat(-20);
  logMsg('Talleyrand & Associés « clarifient » votre dossier. (−800, Radar −20)'); toast('Dossier clarifié : Radar −20'); render();
}
function setTab(t) { G.tab = t; render(); }

/* ---------- Missions ---------- */
function checkMissions() {
  MIS.forEach(m => {
    if (G.mis[m.id] || !m.ok()) return;
    G.mis[m.id] = true;
    if (m.r.cash) G.cash += m.r.cash;
    if (m.r.glory) G.glory += m.r.glory;
    const rw = [m.r.cash ? money(m.r.cash) : '', m.r.glory ? m.r.glory + ' Gloire' : ''].filter(Boolean).join(' + ');
    logMsg(`🎯 Mission accomplie : ${m.t}. Récompense : ${rw}.`);
    toast(`🎯 Mission accomplie ! +${rw}`);
  });
}
const curMission = () => MIS.find(m => !G.mis[m.id]);

/* ---------- Fin de trimestre ---------- */
function endTurn() {
  if (G.queue.length || G.gameover || G.turn > MAX) return;
  document.activeElement && document.activeElement.blur();
  const nw0 = netWorth(), cash0 = G.cash;
  let income = 0, divs = 0;
  G.biz.forEach(b => {
    if (!b.level) return;
    if (b.down > 0) { b.down--; return; }
    income += bizIncome(b) * (b.id === 'orbitales' ? rnd(.5, 1.5) : rnd(.9, 1.1));
  });
  income += provIncome() * rnd(.95, 1.05);
  const safeCost = SAFE[G.safety].cost;
  const interest = G.debt * rate();
  G.cash += income - safeCost - interest;

  let h = -2 + (G.wage === 0 ? 1 : G.wage === 2 ? -1 : 0);
  h += bz('nanobrume').level; h -= 4 * bz('legit').level; if (G.dec.code) h -= 2;
  addHeat(h);
  G.glory += 1 + G.prov.filter(Boolean).length;

  if (G.rateT > 0 && --G.rateT === 0) G.rate = .04;

  G.biz.forEach(b => {
    if (!b.level || b.down > 0 || !EXPLO.includes(b.id)) return;
    if (Math.random() < SAFE[G.safety].p * (b.level > 3 ? 1.3 : 1)) {
      const fee = Math.round(bdef(b.id).cost * .15 * b.level);
      b.down = 2; G.cash -= fee;
      logMsg(`🔥 SURCHAUFFE. ${bdef(b.id).name} a fondu. Réparations : ${money(fee)}, 2 trimestres d'arrêt.`);
      G.queue.push({ title: '🔥 Surchauffe critique', text: `${bdef(b.id).name} vient de fondre. Bilan : ${money(fee)} de réparations et 2 trimestres d'arrêt. Le service communication précise que « tout est sous contrôle » (la pièce, elle, est en feu). <br><small>Astuce : un meilleur niveau de sécurité industrielle réduit ce risque.</small>`, choices: [{ label: 'Parler d\'« incident thermique positif »', run: () => 'Le communiqué dit « montée en température enthousiasmante ». Personne n\'est dupe, mais personne ne vérifie.' }] });
    }
  });

  if (totalLevels() > 0 && Math.random() < WSTRIKE[G.wage]) G.queue.push(strikeEv());

  const moves = [];
  G.stocks.forEach((s, i) => {
    const d = STK[i], p0 = s.price;
    divs += s.held * s.price * d.div * (G.dec.legion ? 2 : 1);
    s.fair *= Math.exp(.008 + .03 * gauss());
    if (d.id === 'NEBU' && Math.random() < .12) s.fair *= Math.exp(rnd(-.4, .4));
    let sh = G.pending[s.id] || 0;
    if (sh < 0 && G.dec.blocus) sh *= .5;
    let lp = Math.log(s.price);
    lp += .18 * (Math.log(s.fair) - lp) + d.vol * .7 * gauss() + Math.log(1 + sh);
    s.price = Math.max(1, Math.exp(lp));
    if (sh) s.fair *= 1 + sh * .4;
    s.hist.push(s.price); if (s.hist.length > 30) s.hist.shift();
    moves.push({ id: s.id, ch: s.price / p0 - 1 });
  });
  G.cash += divs;
  G.lastNet = G.cash - cash0;
  moves.sort((a, b) => b.ch - a.ch);
  G.report = { turn: G.turn, income, charges: safeCost + interest, divs, nw0, best: moves[0], worst: moves[moves.length - 1] };

  logMsg(`Trimestre ${G.turn} : recettes ${money(income)}, charges ${money(safeCost + interest)}, dividendes ${money(divs)}.`);

  if (Math.random() < DIFF[G.diff].ev) {
    const ok = EVENTS.filter(e => e.id !== G.lastEv && (!e.cond || e.cond()));
    const e = pick(ok); G.lastEv = e.id; G.queue.push(e.make());
  }

  G.turn++; G.infl = inflMax();
  prerollNews();
  render();
  processQueue();
}

/* ---------- File d'événements / fins de partie ---------- */
function processQueue() {
  if (G.queue.length) return showEvent(G.queue[0]);
  settleCash();
  if (G.heat >= 100) { trial(); return processQueue(); }
  if (G.report) G.report.nw1 = netWorth();
  if (G.gameover || G.turn > MAX) return showEnd();
  checkMissions();
  saveGame();
  render();
}
function showEvent(ev, result) {
  const m = $('#modal');
  if (result !== undefined) {
    m.innerHTML = `<div class="ov"><div class="modal"><h2>${ev.title}</h2><p>${result}</p><button class="btn" onclick="nextEv()">Continuer ▶</button></div></div>`;

function settleCash() {

    return `<div class="card"><div class="row"><div><h3>${d.id} <span class="pill ${rk}">risque ${d.risk}</span></h3><div class="sub">${d.name} · ${d.desc}</div></div>${spark(s.hist)}</div>
      <div class="row"><div style="font-size:22px;font-weight:800">${s.price.toFixed(2)} <span class="${ch >= 0 ? 'pos' : 'neg'}" style="font-size:14px">${pct(ch)}</span></div><div class="small">Dividende ${(d.div * 100).toFixed(1)} %/trim.</div></div>
      <div class="small" style="margin:4px 0">Détenu : <b>${s.held}</b>${s.held ? ` · PRU ${s.cost.toFixed(2)} · <b class="${pnl >= 0 ? 'pos' : 'neg'}">${pct(pnl)}</b>` : ''} ${tipTxt}</div>
      <div class="row"><button class="btn" onclick="buy('${s.id}')">Acheter ${G.qty === 'max' ? 'max' : '× ' + G.qty}</button><button class="btn w" ${s.held ? '' : 'disabled'} onclick="sell('${s.id}')">Vendre ${G.qty === 'max' ? 'tout' : '× ' + G.qty}</button>
      <button class="btn w sm" onclick="toggleMan('${s.id}')">${G.man[s.id] ? '▲' : '▼'} Manœuvres</button></div>
      ${G.man[s.id] ? `<div style="margin-top:8px;padding-top:8px;border-top:2px dashed var(--ink)"><div class="small">Coûtent un pot-de-vin et augmentent le Radar. Les rumeurs influencent le cours du trimestre prochain.</div><div class="seg"><button class="btn r sm" onclick="rumor('${s.id}',1)">Rumeur flatteuse ↑ · ${rumorCost()}</button><button class="btn r sm" onclick="rumor('${s.id}',-1)">Calomnie ↓ · ${rumorCost()}</button><button class="btn w sm" onclick="tip('${s.id}')">Info d'initié · ${tipCost()}</button></div></div>` : ''}</div>`;
  }).join('') + '</div>';
}
function pDecrets() {
  return `<div class="card" style="margin-bottom:12px"><div class="row"><h3>📜 Décrets impériaux</h3><span class="pill gold">⚜ Gloire : ${G.glory}</span></div><div class="small">Des bonus permanents, achetés avec la Gloire. Elle vient de chaque trimestre (+1), de vos provinces (+1 chacune) et des missions.</div></div>
  <div class="grid">${DEC.map(d => { const o = G.dec[d.id]; return `<div class="card ${o ? 'own' : ''}"><h3>${d.icon} ${d.name}</h3><div class="sub">${d.d}</div><div class="row"><span class="small">Coût : <b>${d.cost} Gloire</b>${!o && G.glory < d.cost ? `<div class="need">Il manque ${d.cost - G.glory} Gloire</div>` : ''}</span>${o ? '<span class="pill gold">En vigueur</span>' : `<button class="btn g" ${G.glory < d.cost ? 'disabled' : ''} onclick="buyDec('${d.id}')">Promulguer</button>`}</div></div>`; }).join('')}</div>`;
}
function pBanque() {
  const lim = borrowLimit();
  return `<div class="grid">
   <div class="card"><h3>🏦 Banque Universelle des Dettes Perpétuelles</h3><div class="sub">« Nous prêtons aux riches, et aux autres quand ils deviennent riches. »</div>
    <div class="row"><span>Dette</span><b class="${G.debt ? 'neg' : ''}">${money(G.debt)}</b></div>
    <div class="row"><span>Plafond autorisé</span><b>${money(lim)}</b></div>
    <div class="row"><span>Taux</span><b>${(rate() * 100).toFixed(1)} % / trimestre${G.rateT ? ` (encore ${G.rateT}t)` : ''}</b></div>
    <div class="seg"><button class="btn sm" onclick="borrow(1000)">Emprunter 1 000</button><button class="btn sm" onclick="borrow(5000)">5 000</button><button class="btn w sm" onclick="repay(1000)">Rembourser 1 000</button><button class="btn w sm" onclick="repay('all')">Tout</button></div>
    <div class="small">Emprunter permet d'investir plus tôt, mais les intérêts tombent même en mauvais trimestre. Si votre trésor passe sous zéro : actions bradées, puis découvert, puis faillite.</div></div>
   <div class="card"><h3>⚖ Cabinet Talleyrand &amp; Associés</h3><div class="sub">« Nous avons trahi tous les régimes. Pourquoi pas le vôtre ? »</div>
    <div class="small">Radar : <b>${Math.round(G.heat)}/100</b>. À 100, procès (amende ≈ 30 % de vos liquidités et titres). Deuxième procès : exil, fin de partie.</div>
    <div class="seg"><button class="btn" onclick="lawyer()" ${G.cash < 800 ? 'disabled' : ''}>« Clarifier le dossier » · −800 ⚜ · Radar −20</button></div>
    <div class="small">Autres moyens de baisser le Radar : Ministère de la Légitimité, politique « Bien-être », décret Code Civil 2.0, patience (−2/trim.).</div></div>
  </div>`;
}
function pJournal() {
  return `<div class="card log">${G.log.map(l => `<p><span class="t">T${l.turn}</span>${l.t}</p>`).join('')}</div>`;
}

/* ---------- Raccourcis & démarrage ---------- */
document.addEventListener('keydown', e => {
  if (!G || $('#modal').innerHTML) return;
  if (e.code === 'Space' && document.activeElement === document.body) { e.preventDefault(); if (!$('#endbtn').disabled) endTurn(); }
  const k = parseInt(e.key); if (k >= 1 && k <= 6) setTab(['empire', 'conq', 'bourse', 'decrets', 'banque', 'journal'][k - 1]);
});
newGame('normal');
startScreen();
</script>
</body>
</html>
