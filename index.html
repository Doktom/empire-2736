<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire 2736</title>
<meta name="description" content="Roguelite économique infini et cynique : un descendant de Napoléon rachète le monde aux mégacorporations en 2736.">
<style>
:root{--bg:#f5f2ea;--bg2:#ebe6d8;--card:#ffffff;--card2:#faf8f2;--ink:#1c2340;--mute:#6c718a;--line:#e3dccb;--blue:#2748c8;--blue2:#e6ecff;--red:#d6384a;--red2:#fde8eb;--gold:#c9961f;--gold2:#fff4d3;--green:#14915f;--green2:#dcf6e9;--violet:#6a42c4;--violet2:#efe8ff;--sh:0 1px 2px rgba(28,35,64,.06),0 8px 22px rgba(28,35,64,.07);--shh:0 2px 4px rgba(28,35,64,.08),0 14px 30px rgba(28,35,64,.13);--r:16px;color-scheme:light}
:root[data-theme=dark]{--bg:#0e1325;--bg2:#141b34;--card:#1a2243;--card2:#202a52;--ink:#e9eefc;--mute:#9aa5cc;--line:#2b3663;--blue:#6f8cff;--blue2:#232e63;--red:#ff6b7a;--red2:#3b2030;--gold:#f0c24a;--gold2:#3a3220;--green:#4fd69c;--green2:#1c3a31;--violet:#a98bff;--violet2:#2b2352;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);--shh:0 2px 4px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:104px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{font-family:Georgia,"Times New Roman",serif}
.stripe{height:5px;background:linear-gradient(90deg,#2748c8 33%,#f4f1ea 33% 66%,#d6384a 66%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.fleur{font-size:34px;color:var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.brand h1{margin:0;font-size:25px;font-weight:900;letter-spacing:1.5px;line-height:1}
.brand small{color:var(--mute)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hud{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(28,35,64,.08)}
.hud-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.hud-in::-webkit-scrollbar{display:none}
.hc{flex:0 0 auto;min-width:100px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px 11px}
.hc label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mute);font-weight:700;white-space:nowrap}
.hc b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;transform-origin:left center}
.hc b .small{font-weight:600}
.hc small{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap}
.hc.main{min-width:160px;background:linear-gradient(135deg,var(--blue2),var(--card2));border-color:var(--blue)}
.hc.main b{font-size:25px}
.hc.warn{border-color:var(--red);background:var(--red2)}
.hc.click{cursor:pointer}
.mini{height:5px;border-radius:3px;background:var(--bg2);margin:3px 0 2px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:3px;transition:width .4s}
.fl-up b{animation:flu 1s ease-out}
.fl-down b{animation:fld 1s ease-out}
@keyframes flu{0%{color:var(--green);transform:scale(1.1)}100%{transform:none}}
@keyframes fld{0%{color:var(--red);transform:scale(1.1)}100%{transform:none}}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{order:2;position:static!important;max-height:none!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;transition:box-shadow .15s,transform .15s,border-color .15s}
.grid>.card:hover{box-shadow:var(--shh);transform:translateY(-2px)}
.card.own{background:var(--gold2);border-color:var(--gold)}
.card.can{border-color:color-mix(in srgb,var(--green) 60%,var(--line))}
.card.lock{background:var(--bg2);border-style:dashed;box-shadow:none;opacity:.75}
.card.vio{background:var(--violet2);border-color:color-mix(in srgb,var(--violet) 50%,var(--line))}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800}
.card .sub{color:var(--mute);font-size:13px;margin-bottom:8px}
.side{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 190px);overflow-y:auto;padding:2px 4px 2px 2px;scrollbar-width:thin}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card2);min-width:0}
.tile.wide{grid-column:1/3}
.tile b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.tile span{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.tile small{display:block;font-size:12px;color:var(--mute)}
.pos{color:var(--green)}.neg{color:var(--red)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2)}
.pill.red{background:var(--red2);color:var(--red);border-color:var(--red)}
.pill.gold{background:var(--gold2);color:var(--gold);border-color:var(--gold)}
.pill.blue{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.pill.green{background:var(--green2);color:var(--green);border-color:var(--green)}
.pill.vio{background:var(--violet2);color:var(--violet);border-color:var(--violet)}
.advisor{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#2748c8,#5b3fd0);color:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px;margin-bottom:12px}
.advisor .av{font-size:30px}
.advisor button{margin-left:auto;white-space:nowrap}
.news{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--sh)}
.news h4{margin:0 0 3px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
.news p{margin:3px 0;font-style:italic}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-weight:700;font-size:14px;box-shadow:var(--sh);transition:.12s}
.tab:hover{border-color:var(--blue)}
.tab.on{background:linear-gradient(180deg,#3a5be0,#2748c8);color:#fff;border-color:transparent}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;box-shadow:0 0 0 2px rgba(214,56,74,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{background:linear-gradient(180deg,#3a5be0,#2748c8);color:#fff;border:none;border-radius:10px;padding:7px 13px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 4px 10px rgba(39,72,200,.22);transition:transform .08s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.w{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(28,35,64,.1)}
.btn.r{background:linear-gradient(180deg,#e45565,#d6384a);color:#fff}
.btn.g{background:linear-gradient(180deg,#e8b23a,#c9961f);color:#2a1d00}
.btn.v{background:linear-gradient(180deg,#8460dc,#6a42c4);color:#fff}
.btn.on{background:linear-gradient(180deg,#25b27d,#14915f);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.big{font-size:16px;padding:9px 18px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button.p{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:600;font-size:13px;transition:.12s}
.seg button.p:hover{border-color:var(--blue)}
.seg button.p.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.small{font-size:12.5px;color:var(--mute)}
.need{font-size:12px;color:var(--red);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar.thin{height:6px;margin:4px 0}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(980px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shh);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5;flex-wrap:wrap}
.bottom .hint{font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(12,17,38,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-width:600px;width:100%;padding:22px;max-height:92vh;overflow:auto;animation:pop .18s ease-out}
.modal.wide{max-width:780px}
@keyframes pop{0%{transform:translateY(8px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
.modal h2{margin:0 0 8px;font-size:23px;font-weight:900}
.modal .opt{display:block;width:100%;text-align:left;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;transition:.12s}
.modal .opt:hover{background:var(--blue2);border-color:var(--blue)}
.modal .opt small{display:block;color:var(--mute);font-weight:400}
.big-icon{font-size:56px;line-height:1}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:var(--card2)}
.dots i.on{background:var(--blue);border-color:var(--blue)}
.log p{margin:3px 0;border-bottom:1px dotted var(--line);padding-bottom:3px}
.log .t{display:inline-block;min-width:38px;font-weight:800;color:var(--blue)}
.mis{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted var(--line)}
.mis .ck{font-size:18px}
.mis.done{opacity:.55;text-decoration:line-through}
.rel{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid color-mix(in srgb,var(--violet) 50%,var(--line));border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 2px 0 0;font-weight:600}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-weight:600;max-width:90vw;text-align:center;box-shadow:var(--shh)}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.brand h1{font-size:20px}.top{padding:8px 10px}.layout{padding:10px}.hud-in{padding:6px 10px}.hc{min-width:92px}.hc.main{min-width:140px}.hc b{font-size:17px}.hc.main b{font-size:22px}.bottom .hint{display:none}.bottom{justify-content:center}.btn.big{font-size:14px;padding:8px 12px}}
</style>
</head>
<body>
<div class="stripe"></div>
<header class="top">
  <div class="brand"><span class="fleur">⚜</span><div><h1>EMPIRE 2736</h1><small>Roguelite infini · racheter le monde</small></div></div>
  <div class="hbtns"><button class="btn v sm" onclick="showHeritage('menu')" id="hbtn">★ Héritage</button><button class="btn w sm" onclick="showMissions()">🎯 Missions</button><button class="btn w sm" onclick="showHelp()">❓ Aide</button><button class="btn w sm" onclick="toggleTheme()" id="tbtn" title="Thème clair / sombre">🌙</button><button class="btn w sm" onclick="showMenu()">☰</button></div>
</header>
<div class="hud"><div class="hud-in" id="hudin"></div></div>
<main class="layout">
  <aside class="side" id="side"></aside>
  <section>
    <div id="advisor"></div>
    <div id="news"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="panel"></div>
  </section>
</main>
<div class="bottom">
  <div class="hint" id="gohint"></div>
  <div class="acts">
    <button class="btn big" id="b1" onclick="advance(1)">Clore ▶</button>
    <button class="btn big w" id="b5" onclick="advance(5)" title="Avance de 5 trimestres (s'arrête au premier événement)">⏩ ×5</button>
    <button class="btn big w" id="b25" onclick="advance(25)" title="Avance de 25 trimestres (s'arrête au premier événement)">⏭ ×25</button>
    <button class="btn big w" id="bauto" onclick="toggleAuto()" title="Avance automatiquement jusqu'au prochain événement">▶ Auto</button>
  </div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   EMPIRE 2736 — roguelite économique infini
   Run = un règne. Il se termine par une chute (échéance impayée, faillite,
   exil) ou une abdication volontaire. On gagne de la Légende pour
   acheter l'Héritage permanent et recommencer plus fort.
   ===================================================================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function num(n) {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a < 1e4) return Math.round(n).toLocaleString('fr-FR');
  if (a >= 1e36) return n.toExponential(2).replace('e+', 'e');
  const i = Math.floor(Math.log10(a) / 3), v = n / Math.pow(1000, i);
  return v.toFixed(Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2) + ' ' + SUF[i];
}
const money = n => num(n) + ' ⚜';
const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
const sgn = n => (n >= 0 ? '+' : '−') + num(Math.abs(n));
const SAVE_KEY = 'empire2736-run-v2', META_KEY = 'empire2736-meta-v2', TUTO_KEY = 'empire2736-tuto-v2';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { } };

/* ---------- Méta-progression ---------- */
let M = { legend: 0, total: 0, up: {}, best: 0, runs: 0, bestEch: 0, bestTurn: 0 };
function loadMeta() { try { const m = JSON.parse(lsGet(META_KEY)); if (m && m.up) M = Object.assign(M, m); } catch (e) { } }
function saveMeta() { lsSet(META_KEY, JSON.stringify(M)); }
const ul = id => M.up[id] || 0;
const UPG = [
  { id: 'cash', icon: '💰', name: 'Fonds de commerce', max: 14, cost: l => Math.ceil(2 * Math.pow(1.8, l)), d: l => `Trésor de départ : ${money(1000 * Math.pow(2, l))}` },
  { id: 'income', icon: '📈', name: 'Savoir-faire dynastique', max: 40, cost: l => Math.ceil(3 * Math.pow(1.5, l)), d: l => `Tous les revenus ×${Math.pow(1.2, l).toFixed(2)}` },
  { id: 'levels', icon: '⛏', name: 'Armée de réserve', max: 12, cost: l => Math.ceil(4 * Math.pow(1.7, l)), d: l => `Démarrage avec ${3 * l} niveaux de Mines de Lithium` },
  { id: 'infl', icon: '🕴', name: 'Réseau d\'influence', max: 4, cost: l => Math.ceil(8 * Math.pow(2.5, l)), d: l => `+${l} pot(s)-de-vin par trimestre` },
  { id: 'diplo', icon: '🕊', name: 'Diplomatie', max: 8, cost: l => Math.ceil(5 * Math.pow(1.6, l)), d: l => `Radar : gains −${7 * l} %` },
  { id: 'depth', icon: '🌊', name: 'Marchés profonds', max: 10, cost: l => Math.ceil(4 * Math.pow(1.7, l)), d: l => `Profondeur de la Bourse ×${Math.pow(1.6, l).toFixed(1)}` },
  { id: 'div', icon: '💵', name: 'Dividendes dynastiques', max: 10, cost: l => Math.ceil(4 * Math.pow(1.6, l)), d: l => `Dividendes +${30 * l} %` },
  { id: 'bank', icon: '🏦', name: 'Intérêts de famille', max: 6, cost: l => Math.ceil(5 * Math.pow(1.7, l)), d: l => `Intérêts −${8 * l} %, plafond d'emprunt +${12 * l} %` },
  { id: 'glory', icon: '⚜', name: 'Gloire héréditaire', max: 10, cost: l => Math.ceil(6 * Math.pow(1.7, l)), d: l => `+${l} Gloire par trimestre` },
  { id: 'memoire', icon: '🧠', name: 'Mémoire des Anciens', max: 8, cost: l => Math.ceil(10 * Math.pow(1.9, l)), d: l => `Tribut des échéances −${7 * l} %` },
  { id: 'relics', icon: '🎁', name: 'Choix élargi', max: 3, cost: l => Math.ceil(15 * Math.pow(3, l)), d: l => `${3 + l} reliques proposées à chaque choix` },
  { id: 'auto', icon: '🤖', name: 'Régence automatique', max: 2, cost: l => [25, 120][l], d: l => ['Aucune automatisation', 'Intendant : achète les activités à votre place (option)', 'Chambellan : + décrets, réformes et territoires (option)'][l] },
  { id: 'horizons', icon: '🔭', name: 'Nouveaux horizons', max: 12, cost: l => l < 4 ? [15, 60, 250, 1000][l] : Math.ceil(1000 * Math.pow(2.4, l - 3)), d: l => l === 0 ? 'Activités de rang 7 et plus verrouillées' : `Débloque jusqu'à : ${BIZ[5 + l].icon} ${BIZ[5 + l].name} (rang ${6 + l})` },
  { id: 'legend', icon: '★', name: 'Aura de légende', max: 10, cost: l => Math.ceil(10 * Math.pow(2, l)), d: l => `Légende gagnée +${10 * l} %` },
];
function buyUpg(id) {
  const u = UPG.find(x => x.id === id), l = ul(id);
  if (l >= u.max) return;
  const c = u.cost(l);
  if (M.legend < c) return toast('Pas assez de Légende');
  M.legend -= c; M.up[id] = l + 1; saveMeta();
  toast(`${u.icon} ${u.name} → niveau ${l + 1}`);
  showHeritage(heritageBack);
  if (G) render();
}

/* ---------- Données de jeu ---------- */
const GROW = 1.14;
const MS = [10, 25, 50, 100, 200, 400, 800, 1600];
const msMult = L => Math.pow(2, MS.filter(m => L >= m).length);
const BIZ = [
  { id: 'lithium', icon: '⛏', name: 'Mines de Lithium de Marengo', c0: 100, r: .30, explo: true, flav: 'Rentable, bruyante, sujette à la surchauffe.' },
  { id: 'cafe', icon: '☕', name: 'Cafés Synthétiques « Le Grognard »', c0: 1200, r: .22, flav: 'Le café n\'a jamais vu un grain. Les clients non plus.' },
  { id: 'drones', icon: '🤖', name: 'Manufacture de Drones de la Vieille Garde', c0: 15000, r: .20, explo: true, flav: 'Ils meurent en chantant. Surchauffe fréquente.' },
  { id: 'orbitales', icon: '🛰', name: 'Régie Publicitaire Orbitale', c0: 2e5, r: .18, vol: true, flav: 'Des panneaux dans le ciel. Recettes capricieuses.' },
  { id: 'nanobrume', icon: '🌫', name: 'Usine de Nano-Brume Sociale', c0: 3e6, r: .16, explo: true, heat: true, flav: 'Très lucratif. Les riverains rient sans raison. Radar +.' },
  { id: 'fusion', icon: '⚛', name: 'Réacteurs à Fusion Froide « Austerlitz »', c0: 5e7, r: .15, explo: true, flav: 'Froid, en théorie. Le mot « fusion » est exact.' },
  { id: 'clones', icon: '🧬', name: 'Fabrique de Clones de Cour', c0: 8e8, r: .14, unlock: 1, flav: 'Des courtisans à la demande. Ils applaudissent en rythme.' },

function maxBuy(id) {
  const s = st(id), d = stockDepth(id), C = G.cash / 1.01; if (C <= 0) return 0;
  const x = d * (-1 + Math.sqrt(1 + 2 * C / d));
  return Math.floor(Math.min(x, 3 * d) / s.price);
}
function buy(id) {
  const s = st(id);
  let n = G.qty === 'max' ? maxBuy(id) : G.qty;
  if (n <= 0) return toast('Fonds insuffisants');
  let q = buyQuote(id, n);
  if (q.cost > G.cash) { n = maxBuy(id); if (n <= 0) return toast('Fonds insuffisants'); q = buyQuote(id, n); toast(`Fonds limités : achat de ${num(n)}`); }
  s.cost = (s.cost * s.held + q.avg * n) / (s.held + n);
  G.cash -= q.cost; s.held += n;
  s.price *= 1 + q.imp * .5; s.hist[s.hist.length - 1] = s.price;
  render();
}
function sell(id) {
  const s = st(id), d = stockDepth(id);
  let n = G.qty === 'max' ? s.held : Math.min(G.qty, s.held);
  if (n <= 0) return;
  const imp = Math.min(n * s.price / d, 1.8);
  G.cash += n * s.price * (1 - imp / 2) * .99;
  s.held -= n; if (!s.held) s.cost = 0;
  s.price = Math.max(1, s.price * Math.max(.2, 1 - imp * .5)); s.hist[s.hist.length - 1] = s.price;
  render();
}

/* ---------- Boucle principale ---------- */
function autoActions() {
  if (ul('auto') < 1) return;
  const reserve = (echTurn() - G.turn <= 2) ? echDemand() : 0;
  if (G.auto.biz) {
    for (let k = 0; k < 120; k++) {
      let best = -1, bi = -1;
      BIZ_PROD.forEach(i => {
        if (!unlocked(i)) return;
        const c = bizUnit(i); if (c > G.cash - reserve) return;
        const L = G.biz[i].level, g = bizIncomeAt(i, L + 1) - (L ? bizIncomeAt(i, L) : 0), roi = g / c;
        if (roi > best) { best = roi; bi = i; }
      });
      if (bi < 0) break;
      const c = bizUnit(bi); G.cash -= c; G.biz[bi].inv += c; G.biz[bi].level++;
    }
  }
  if (ul('auto') >= 2 && G.auto.dec) {
    DEC.forEach(d => { if (!G.dec[d.id] && G.glory >= d.cost) { G.glory -= d.cost; G.dec[d.id] = true; } });
    while (G.glory >= reformCost() && G.refs < 500) { G.glory -= reformCost(); G.refs++; }
    let n = 0;
    while (n++ < 5 && G.heat < 60 && terrCost(G.terr) <= (G.cash - reserve) * .5 && G.queue.length === 0) buyTerr(true);
  }
}
function turnCore() {
  const cash0 = G.cash, nw0 = netWorth();
  let income = 0, divs = 0;
  BIZ_PROD.forEach(i => {
    const b = G.biz[i];
    if (!b.level) return;
    if (b.down > 0) { b.down--; return; }
    income += bizIncome(i) * (BIZ[i].vol ? rnd(.5, 1.5) : rnd(.92, 1.08));
  });
  const sc = safeCost(), interest = G.debt * rate();
  G.cash += income - sc - interest;

  let pos = (G.wage === 0 ? 1 : 0), neg = 2 + (G.wage === 2 ? 1 : 0) + legitReduce() + (G.dec.code ? 2 : 0) + (rel('tabatiere') ? 2 : 0);
  BIZ_PROD.forEach(i => { if (BIZ[i].heat && G.biz[i].level) pos += .8 * Math.sqrt(G.biz[i].level); });
  addHeat(pos); addHeat(-neg);
  G.glory += gloryPerTurn();
  if (G.rateT > 0 && --G.rateT === 0) G.rate = .04;
  if (G.strikes > 0 && G.turn - G.lastTrial >= 20) { G.strikes--; G.lastTrial = G.turn; logMsg('Votre casier judiciaire s\'efface (un peu, par ancienneté).'); }

  BIZ_PROD.forEach(i => {
    const b = G.biz[i];
    if (!b.level || b.down > 0 || !BIZ[i].explo) return;
    if (Math.random() < SAFE[G.safety].p * (rel('titane') ? .25 : 1) * (b.level > 30 ? 1.3 : 1)) {
      const fee = Math.round(bizIncome(i)); b.down = 2; G.cash -= fee;
      logMsg(`🔥 SURCHAUFFE. ${BIZ[i].name} a fondu. Réparations : ${money(fee)}, 2 trimestres d'arrêt.`);
      G.queue.push({ title: '🔥 Surchauffe critique', text: `${BIZ[i].name} vient de fondre. Bilan : ${money(fee)} de réparations (un trimestre de revenus de ce site) et 2 trimestres d'arrêt. Le service communication précise que « tout est sous contrôle » (la pièce, elle, est en feu).<br><small>Astuce : un meilleur niveau de sécurité industrielle réduit ce risque.</small>`, choices: [{ label: 'Parler d\'« incident thermique positif »', run: () => 'Le communiqué dit « montée en température enthousiasmante ». Personne n\'est dupe, mais personne ne vérifie.' }] });
    }
  });
  if (totalLevels() > 0 && !rel('grognards') && Math.random() < WSTRIKE[G.wage]) G.queue.push(strikeEv());

  const moves = [];
  G.stocks.forEach((s, i) => {
    const d = STK[i], p0 = s.price;
    divs += s.held * s.price * d.div * divMult();
    s.fair *= Math.exp(.008 + .03 * gauss());
    if (d.id === 'NEBU' && Math.random() < .12) s.fair *= Math.exp(rnd(-.4, .4));
    let sh = G.pending[s.id] || 0;
    if (sh < 0 && G.dec.blocus) sh *= .5;
    let lp = Math.log(s.price);
    lp += .18 * (Math.log(s.fair) - lp) + d.vol * .7 * gauss() + Math.log(1 + sh);
    s.price = Math.max(1, Math.exp(lp));
    if (sh) s.fair *= 1 + sh * .4;
    s.hist.push(s.price); if (s.hist.length > 30) s.hist.shift();
    moves.push({ id: s.id, ch: s.price / p0 - 1 });
  });
  G.cash += divs;
  moves.sort((a, b) => b.ch - a.ch);
  G.report = { turn: G.turn, income, charges: sc + interest, divs, nw0, best: moves[0], worst: moves[moves.length - 1] };
  logMsg(`Trimestre ${G.turn} : recettes ${money(income)}, charges ${money(sc + interest)}, dividendes ${money(divs)}.`);

  if (Math.random() < .7) {
    const ok = EVENTS.filter(e => e.id !== G.lastEv && (!e.cond || e.cond()));
    const e = pick(ok); G.lastEv = e.id; G.queue.push(e.make());
  }

  // Échéance impériale
  if (G.turn === echTurn()) {
    const dem = echDemand();
    const avail = Math.max(0, G.cash) + stockValue() * .95 + Math.max(0, borrowLimit() - G.debt);
    if (avail < dem) {
      G.gameover = { kind: 'fall', title: '⏳ Échéance impayée', text: `Le Conseil Mondial réclamait ${money(dem)} de tribut (échéance n°${G.ech + 1}). Vous n'aviez pas la réserve. Huissiers-drones, saisie, reprise de vos activités par une filiale du Conseil. Votre règne s'achève dans une clause en petits caractères.` };
    } else {
      G.cash -= dem; G.ech++; G.glory += 3;
      logMsg(`⏳ Échéance impériale n°${G.ech} payée : −${money(dem)}. +3 Gloire.`);
      G.queue.push(relicEvent(`Échéance n°${G.ech} payée (−${money(dem)}). Le Conseil, de bonne humeur, vous offre un butin de guerre.`));
    }
  }

  G.turn++; G.infl = inflMax();
  prerollNews();
  autoActions();
  settleCash();
  if (!G.gameover && G.heat >= 100) trial();
  const nw = netWorth();
  G.lastNet = G.cash - cash0 + (nw - nw0 - (G.cash - cash0)) * 0;
  G.peakNW = Math.max(G.peakNW, nw);
  G.nwHist.push(nw); if (G.nwHist.length > 240) G.nwHist = G.nwHist.filter((_, i) => i % 2 === 0 || i === G.nwHist.length - 1);
  if (G.report) G.report.nw1 = nw;
}
function advance(n) {
  if (!G || G.queue.length || G.gameover) return;
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  for (let k = 0; k < n; k++) { turnCore(); if (G.queue.length || G.gameover) break; }
  processQueue();
}

}
function chooseEv(i) {
  const ev = G.queue[0];
  const r = ev.choices[i].run();
  logMsg(ev.title.replace(/^\S+\s/, '') + ' : ' + r);
  showEvent(ev, r); render();
}
function nextEv() { G.queue.shift(); closeModal(); settleCash(); if (!G.gameover && G.heat >= 100) trial(); processQueue(); }
function settleCash() {
  if (G.cash >= 0) return;
  for (const s of G.stocks) {
    if (G.cash >= 0) break; if (!s.held) continue;
    const n = Math.min(s.held, Math.ceil(-G.cash / (s.price * .95)));
    G.cash += n * s.price * .95; s.held -= n; if (!s.held) s.cost = 0;
    logMsg(`Liquidation forcée : ${num(n)} ${s.id} bradées à 95 %.`);
  }
  if (G.cash < 0) {
    const b = Math.min(borrowLimit() - G.debt, -G.cash);
    if (b > 0) { G.debt += b; G.cash += b; logMsg(`Le banquier couvre votre découvert de ${money(b)}. Il sourit : mauvais signe.`); }
  }
  if (G.cash < 0) {
    const order = BIZ_PROD.filter(i => G.biz[i].level > 0).sort((a, b) => G.biz[b].inv - G.biz[a].inv);
    for (const i of order) {
      if (G.cash >= -1) break;
      const b = G.biz[i], val = b.inv * .6, need = -G.cash;
      const nl = val <= need ? 0 : Math.floor(b.level * (1 - need / val));
      const ninv = nl ? BIZ[i].c0 * (Math.pow(GROW, nl) - 1) / (GROW - 1) : 0;
      G.cash += Math.max(0, b.inv - ninv) * .6; b.level = nl; b.inv = ninv;
      logMsg(`🏚 Saisie : ${BIZ[i].name} ramenée au niveau ${nl} pour couvrir vos dettes.`);
    }
    if (G.cash >= -1) G.cash = Math.max(G.cash, 0);
  }
  if (G.cash < 0 && !G.gameover) G.gameover = { kind: 'fall', title: '💀 Faillite', text: 'Vos créanciers sont à la porte, avec des drones et des tableurs. Votre empire est dissous, puis revendu en lots, puis transformé en publicité pour une lessive.' };
}
function trial() {
  G.strikes++; G.lastTrial = G.turn;
  const fine = Math.round(Math.max(500, .3 * (Math.max(0, G.cash) + stockValue())) * (rel('faust') ? 3 : 1));
  G.cash -= fine; G.heat = 55;
  settleCash();
  if (G.strikes >= 2) { G.gameover = { kind: 'fall', title: '🪐 Exil à Sainte-Hélène-Orbitale', text: `Deuxième procès, deuxième condamnation. Le juge-IA vous reconnaît : vous lui avez prêté de l'argent. Il vous condamne quand même. Amende : ${money(fine)}, puis navette vers Sainte-Hélène-Orbitale, station 7, vue sur la Terre, wifi payant. L'histoire bégaye, mais avec de meilleures prestations.` }; return; }
  logMsg(`⚖ Tribunal arbitral : amende de ${money(fine)}. Avertissement : une deuxième condamnation = exil.`);
  G.queue.push({ title: '⚖ Tribunal Arbitral Inter-Corporations', text: `Le Radar a débordé. Le tribunal vous inflige ${money(fine)} d'amende « pour l'exemple ». Le juge-IA précise que la prochaine fois, ce sera l'exil sur une station orbitale. Il vous envoie sa carte de visite, avec un lien sponsorisé. (Le casier s'efface après 20 trimestres sans procès.)`, choices: [{ label: 'Payer en grinçant des dents', run: () => 'Vous sortez libre, léger de quelques milliers de ⚜ et d\'un peu de dignité. Le Radar retombe à 55.' }] });
}
function legendGain(abd) {
  const lg = Math.max(0, Math.log10(G.peakNW + 1) - 2);
  let g = Math.floor(lg * lg * 1.2) + 2 * G.ech + G.terr;
  g *= 1 + .1 * ul('legend'); if (abd) g *= 1.15;
  return Math.floor(g);
}

    <div class="hc"><label>Trimestre</label><b>${G.turn}</b><small>${G.relics.length} relique(s)</small></div>
    <div class="hc main${flc(G.cash, P.cash)}" title="Votre trésor disponible"><label>⚜ Trésor</label><b class="${G.cash < 0 ? 'neg' : ''}">${num(G.cash)}</b><small class="${en >= 0 ? 'pos' : 'neg'}">${sgn(en)} / trim.</small></div>
    <div class="hc${flc(nw, P.nw)}" title="Trésor + titres + activités (60 %) + territoires (70 %) − dette"><label>Patrimoine</label><b>${num(nw)}</b><small class="${dnw === null ? '' : dnw >= 0 ? 'pos' : 'neg'}">${dnw === null ? '—' : sgn(dnw) + ' ce trim.'}</small></div>
    ${G.debt > 0 ? `<div class="hc"><label>Dette</label><b class="neg">${num(G.debt)}</b><small>${(rate() * 100).toFixed(1)} %/trim.</small></div>` : ''}
    <div class="hc click${warnE ? ' warn' : ''}" onclick="setTab('banque')" title="Tribut à payer : prélevé sur trésor, titres, puis découvert"><label>⏳ Échéance n°${G.ech + 1}</label><b>${tl} trim.</b>
      <div class="mini"><i style="width:${Math.min(100, 100 * Math.max(0, ready) / dem)}%;background:${ready >= dem ? 'var(--green)' : 'var(--gold)'}"></i></div>
      <small>Tribut ${num(dem)} · ${ready >= dem ? 'réserve OK' : 'manque ' + num(dem - ready)}</small></div>
    <div class="hc click" onclick="setTab('banque')" title="À 100 : procès. Deux procès : exil."><label>📡 Radar · casier ${G.strikes}/2</label><b>${Math.round(G.heat)}<span class="small">/100</span></b><div class="mini"><i style="width:${Math.min(100, G.heat)}%;background:${hc}"></i></div><small>${zone[0]}</small></div>
    <div class="hc click${flc(G.glory, P.glory)}" onclick="setTab('decrets')"><label>⚜ Gloire</label><b>${num(G.glory)}</b><small>+${gloryPerTurn()} / trim.</small></div>
    <div class="hc" title="Rumeurs, calomnies et infos d'initié par trimestre"><label>Pots-de-vin</label><b>${G.infl}/${inflMax()}</b><small>ce trimestre</small></div>
    <div class="hc click" onclick="showHeritage('menu')" title="Légende disponible pour l'Héritage"><label>★ Légende</label><b>${num(M.legend)}</b><small>+${num(legendGain(true))} si fin</small></div>`;
  hudPrev = { cash: G.cash, nw, glory: G.glory };
  const cm = curMission(), r = G.report;
  $('#side').innerHTML = `
  <div class="card"><div class="row"><h3>📈 Patrimoine</h3><span class="small">échelle log.</span></div>${spark(G.nwHist.map(v => Math.log10(Math.max(1, v))), 250, 44, '#2748c8')}
    <div class="small">Max : <b>${money(G.peakNW)}</b> · ${G.terr} territoire(s) · ${G.ech} échéance(s)</div></div>
  ${G.relics.length ? `<div class="card vio"><h3>🎁 Reliques</h3>${G.relics.map(id => { const x = RELICS.find(y => y.id === id); return `<span class="rel" title="${x.d}">${x.icon} ${x.name}</span>`; }).join('')}</div>` : ''}
  <div class="card vio" style="cursor:pointer" onclick="showAbdicate()" title="Terminer ce règne et encaisser la Légende"><div class="row"><b>★ Légende si fin maintenant</b><b>+${num(legendGain(true))}</b></div><div class="small">Cliquez pour abdiquer.</div></div>
  ${r ? `<div class="card"><h3>Dernier trimestre (T${r.turn})</h3>
    <div class="row small"><span>Recettes</span><b class="pos">${sgn(r.income)}</b></div>
    <div class="row small"><span>Charges &amp; intérêts</span><b class="neg">−${num(r.charges)}</b></div>
    <div class="row small"><span>Dividendes</span><b class="pos">${sgn(r.divs)}</b></div>
    ${r.best ? `<div class="row small"><span>Meilleur titre</span><b>${r.best.id} <span class="pos">${pct(r.best.ch)}</span></b></div><div class="row small"><span>Pire titre</span><b>${r.worst.id} <span class="neg">${pct(r.worst.ch)}</span></b></div>` : ''}</div>` : ''}
  ${cm ? `<div class="card" style="cursor:pointer" onclick="showMissions()"><h3>🎯 Mission</h3><div>${cm.t}</div><div class="small">Récompense : ${missionReward(cm)}</div></div>` : ''}`;

  const a = advice();
  $('#advisor').innerHTML = a ? `<div class="advisor"><span class="av">🎩</span><div><b>Conseiller Talleyrand :</b> ${a.t}</div>${a.b && (a.tab || a.fn) ? `<button class="btn w sm" onclick="${a.tab ? `setTab('${a.tab}')` : a.fn}">${a.b} ▶</button>` : ''}</div>` : '';
  $('#news').innerHTML = `<div class="news"><h4>📡 L'Imperial Feed™ — actualités sponsorisées</h4>${G.heads.map(h => `<p>« ${h.t} »</p>`).join('')}<div class="small">1 rumeur sur 5 est fausse. Comme les autres informations.</div></div>`;
  const decOk = DEC.some(d => !G.dec[d.id] && d.cost <= G.glory) || G.glory >= reformCost();
  const tabs = [['empire', '🏭 Corporation'], ['conq', '🏴 Territoires', terrCost(G.terr) <= G.cash], ['bourse', '📈 Bourse'], ['decrets', '📜 Décrets', decOk], ['banque', '🏦 Banque'], ['journal', '📒 Journal']];
  $('#tabs').innerHTML = tabs.map(([k, n, dot], i) => `<button class="tab ${G.tab === k ? 'on' : ''}" onclick="setTab('${k}')" title="Raccourci : ${i + 1}">${n}${dot ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('#panel').innerHTML = { empire: pEmpire, conq: pConq, bourse: pBourse, decrets: pDecrets, banque: pBanque, journal: pJournal }[G.tab]();
  $('#gohint').innerHTML = `Revenu net : <b class="${en >= 0 ? 'pos' : 'neg'}">${sgn(en)} ⚜</b>/trim. · échéance dans <b>${tl}</b>`;
  const dis = !!G.gameover || G.queue.length > 0;
  ['b1', 'b5', 'b25'].forEach(id => { $('#' + id).disabled = dis; });
  const ba = $('#bauto'); ba.textContent = autoTimer ? '⏸ Pause' : '▶ Auto'; ba.className = 'btn big ' + (autoTimer ? 'on' : 'w');
  if (G.queue.length && !$('#modal').innerHTML) showEvent(G.queue[0]);
}
function pEmpire() {
  const qtys = [1, 10, 100, 'max'];
  const head = `<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>🏭 Corporation</h3><div class="small">Chaque niveau coûte +${Math.round((GROW - 1) * 100)} %. Revenus ×2 aux niveaux ${MS.slice(0, 5).join(', ')}…</div></div>
    <div><span class="small">Acheter :</span><div class="seg" style="margin:2px 0">${qtys.map(q => `<button class="p ${G.bq === q ? 'on' : ''}" onclick="setBq(${typeof q === 'string' ? `'${q}'` : q})">${q === 'max' ? 'Max' : '× ' + q}</button>`).join('')}</div></div></div>
    ${ul('auto') >= 1 ? `<div class="seg"><button class="btn sm ${G.auto.biz ? 'on' : 'w'}" onclick="toggleAutoOpt('biz')">🤖 Intendant : ${G.auto.biz ? 'ON' : 'OFF'}</button>${ul('auto') >= 2 ? `<button class="btn sm ${G.auto.dec ? 'on' : 'w'}" onclick="toggleAutoOpt('dec')">🤖 Chambellan : ${G.auto.dec ? 'ON' : 'OFF'}</button>` : ''}<span class="small">Achats automatiques à chaque trimestre.</span></div>` : ''}</div>`;
  let lockedShown = 0;
  const cards = BIZ.map((d, i) => {
    const b = G.biz[i];
    if (!unlocked(i)) { if (lockedShown++) return ''; return `<div class="card lock"><h3>🔒 ${d.name}</h3><div class="sub">Rang ${BIZ_PROD.indexOf(i) + 1} · débloqué par l'Héritage « Nouveaux horizons » niveau ${d.unlock - 0}. Il existe d'autres rangs au-delà…</div></div>`; }
    const isDeal = G.deal && G.deal.i === i;
    let n = G.bq === 'max' ? bizMaxN(i) : G.bq; if (n <= 0) n = 1;
    const c = bizCostN(i, n), can = c <= G.cash;
    if (d.util) {
      return `<div class="card"><h3>${d.icon} ${d.name}</h3><div class="sub">${d.flav}</div>
      <div class="row"><div>Niveau <b>${b.level}</b> ${isDeal ? '' : ''}</div><div class="small">Radar −${legitReduce().toFixed(1)}/trim. → −${(3 * Math.sqrt(b.level + n)).toFixed(1)}</div></div>
      <div class="row" style="margin-top:8px"><div class="small">+${n} niveau(x) : <b>${money(c)}</b>${missing(c)}</div><button class="btn" ${can ? '' : 'disabled'} onclick="buyBiz(${i})">Améliorer ×${n}</button></div></div>`;
    }
    const now = b.level ? bizIncome(i) : 0, nxt = bizIncomeAt(i, b.level + n);
    const nm = MS.find(m => m > b.level);
    return `<div class="card ${can ? 'can' : ''}"><div class="row"><h3>${d.icon} ${d.name}</h3>${can && !b.down ? '<span class="pill green">✓ Abordable</span>' : ''}</div><div class="sub">${d.flav}</div>
      <div class="row"><div>Niveau <b>${b.level}</b> ${b.down ? `<span class="pill red">à l'arrêt ${b.down}t</span>` : ''} ${isDeal ? `<span class="pill gold">−${Math.round(G.deal.disc * 100)} % ce trim.</span>` : ''}</div><div class="small">${b.level ? 'Rapporte ≈ ' + money(now) + '/trim.' : 'Non construit'}</div></div>
      <div class="small">Palier de revenus ×2 au niveau <b>${nm}</b></div>${nm ? `<div class="bar thin" title="Progression vers le prochain palier"><i style="width:${Math.round(100 * (b.level - ([0, ...MS].filter(m => m <= b.level).pop())) / (nm - ([0, ...MS].filter(m => m <= b.level).pop())))}%;background:var(--gold)"></i></div>` : ''}
      <div class="row" style="margin-top:8px"><div class="small">${b.level ? 'Amélioration' : 'Construction'} ×${n} : <b>${money(c)}</b><br>Gain : <b class="pos">+${money(nxt - now)}</b>/trim.${missing(c)}</div>
      <button class="btn" ${can ? '' : 'disabled'} onclick="buyBiz(${i})">${b.level ? 'Améliorer' : 'Construire'} ×${n}</button></div></div>`;
  }).join('');
  return `${head}<div class="grid">${cards}</div>
  <div class="grid" style="margin-top:12px">
    <div class="card"><h3>👥 Politique sociale</h3><div class="sub">Affecte vos revenus, les grèves et le Radar.</div><div class="seg">${WAGE.map((w, i) => `<button class="p ${G.wage === i ? 'on' : ''}" onclick="setWage(${i})">${w.n}</button>`).join('')}</div><div class="small">${WAGE[G.wage].d}</div></div>
    <div class="card"><h3>🦺 Sécurité industrielle</h3><div class="sub">Réduit le risque de surchauffe (mines, drones, nano-brume, fusion).</div><div class="seg">${SAFE.map((w, i) => `<button class="p ${G.safety === i ? 'on' : ''}" onclick="setSafe(${i})">${w.n}</button>`).join('')}</div><div class="small">${SAFE[G.safety].d}</div></div>
  </div>`;
}
function pConq() {
  const k = eraOf(G.terr), end = eraEnd(G.terr), start = k === 0 ? 0 : ERA_END[k - 1] || (end - 20);
  let list = '';
  for (let j = 0; j < 6; j++) {
    const n = G.terr + j, c = terrCost(n), era = Math.min(eraOf(n), TERR_FLAV.length - 1), first = j === 0;
    list += `<div class="card ${first ? (c <= G.cash ? 'can' : '') : 'lock'}"><h3>🏴 ${terrName(n)}</h3><div class="sub">${TERR_FLAV[era]}</div>
    <div class="row"><div class="small">+4 % de revenus, +½ Gloire/trim.<br>Prix : <b>${money(c)}</b>${first ? missing(c) : ''}</div>${first ? `<button class="btn g" ${c > G.cash ? 'disabled' : ''} onclick="buyTerr()">Racheter</button>` : '<span class="pill">à venir</span>'}</div></div>`;
  }
  return `<div class="card" style="margin-bottom:12px"><div class="row"><h3>🏴 Territoires — ${ERA_NAMES[Math.min(k, ERA_NAMES.length - 1)]}</h3><b>${G.terr} rachetés</b></div>
  <div class="bar"><i style="width:${Math.min(100, 100 * (G.terr - start) / Math.max(1, end - start))}%;background:var(--gold)"></i></div>
  <div class="small" style="margin-top:6px">Prochain Sacre à <b>${end}</b> territoires (relique + Gloire). Bonus de revenus actuel : <b>+${Math.round((terrBonus() - 1) * 100)} %</b>. ${rel('statue') ? '' : 'Chaque rachat fait monter le Radar de 6.'}</div>
  <div class="seg"><button class="btn g sm" onclick="buyAllTerr()" ${terrCost(G.terr) > G.cash ? 'disabled' : ''}>Tout racheter (max abordable)</button></div></div>
  <div class="grid">${list}</div>`;
}
function pBourse() {
  const val = stockValue(), inv = G.stocks.reduce((a, s) => a + s.held * s.cost, 0);
  const qtys = [1, 10, 100, 1000, 'max'];
  return `<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>💼 Mon portefeuille</h3><div class="small">Valeur ${money(val)}${inv ? ` · gain latent <b class="${val >= inv ? 'pos' : 'neg'}">${sgn(val - inv)} ⚜</b>` : ''}</div></div>
  <div><span class="small">Quantité par ordre :</span><div class="seg" style="margin:2px 0">${qtys.map(q => `<button class="p ${G.qty === q ? 'on' : ''}" onclick="setQty(${typeof q === 'string' ? `'${q}'` : q})">${q === 'max' ? 'Max' : '× ' + num(q)}</button>`).join('')}</div></div></div>
  <div class="small">Taxe de 1 %. <b>Vos gros ordres déplacent le cours</b> (impact indiqué sur chaque carte) : fractionnez-les. La profondeur du marché grandit avec le temps. Les cours reviennent vers une valeur cachée.</div></div>
  <div class="grid">` + G.stocks.map((s, i) => {
    const d = STK[i], prev = s.hist.length > 1 ? s.hist[s.hist.length - 2] : s.price, ch = s.price / prev - 1;
    const t = G.tips[s.id];
    const tipTxt = t === undefined ? '' : `<span class="pill gold">Initié : ${Math.abs(t) < .001 ? 'rien de prévu' : pct(t) + ' attendu'}</span>`;
    const pnl = s.held ? (s.price / s.cost - 1) : 0;
    const rk = { 'faible': 'green', 'moyen': 'blue', 'élevé': 'gold', 'très élevé': 'red' }[d.risk];
    const dep = stockDepth(s.id), nq = G.qty === 'max' ? maxBuy(s.id) : G.qty, imp = Math.min(nq * s.price / dep, 3) * .5;
    return `<div class="card"><div class="row"><div><h3>${d.id} <span class="pill ${rk}">risque ${d.risk}</span></h3><div class="sub">${d.name} · ${d.desc}</div></div>${spark(s.hist)}</div>
      <div class="row"><div style="font-size:22px;font-weight:800">${s.price.toFixed(2)} <span class="${ch >= 0 ? 'pos' : 'neg'}" style="font-size:14px">${pct(ch)}</span></div><div class="small">Dividende ${(d.div * 100 * divMult()).toFixed(1)} %/trim.</div></div>
      <div class="small" style="margin:4px 0">Détenu : <b>${num(s.held)}</b>${s.held ? ` · PRU ${s.cost.toFixed(2)} · <b class="${pnl >= 0 ? 'pos' : 'neg'}">${pct(pnl)}</b>` : ''} ${tipTxt}</div>
      <div class="small">Profondeur : ${money(dep)} · impact de l'ordre : <b class="${imp > .05 ? 'neg' : ''}">±${(imp * 100).toFixed(1)} %</b></div>
      <div class="row" style="margin-top:6px"><button class="btn" onclick="buy('${s.id}')">Acheter ${G.qty === 'max' ? 'max' : '× ' + num(G.qty)}</button><button class="btn w" ${s.held ? '' : 'disabled'} onclick="sell('${s.id}')">Vendre ${G.qty === 'max' ? 'tout' : '× ' + num(G.qty)}</button>
      <button class="btn w sm" onclick="toggleMan('${s.id}')">${G.man[s.id] ? '▲' : '▼'} Manœuvres</button></div>
      ${G.man[s.id] ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)"><div class="small">Coûtent un pot-de-vin et augmentent le Radar. Les rumeurs influencent le cours du trimestre prochain.</div><div class="seg"><button class="btn r sm" onclick="rumor('${s.id}',1)">Rumeur flatteuse ↑ · ${num(rumorCost())}</button><button class="btn r sm" onclick="rumor('${s.id}',-1)">Calomnie ↓ · ${num(rumorCost())}</button><button class="btn w sm" onclick="tip('${s.id}')">Info d'initié · ${num(tipCost())}</button></div></div>` : ''}</div>`;
  }).join('') + '</div>';
}
function pDecrets() {
  const rc = reformCost();
  return `<div class="card" style="margin-bottom:12px"><div class="row"><h3>📜 Décrets &amp; réformes</h3><span class="pill gold">⚜ Gloire : ${num(G.glory)}</span></div><div class="small">Des bonus pour ce règne, achetés avec la Gloire (+${gloryPerTurn()}/trimestre, plus les missions, échéances et Sacres).</div></div>
  <div class="grid">${DEC.map(d => { const o = G.dec[d.id]; return `<div class="card ${o ? 'own' : ''}"><h3>${d.icon} ${d.name}</h3><div class="sub">${d.d}</div><div class="row"><span class="small">Coût : <b>${d.cost} Gloire</b>${!o && G.glory < d.cost ? `<div class="need">Il manque ${d.cost - G.glory} Gloire</div>` : ''}</span>${o ? '<span class="pill gold">En vigueur</span>' : `<button class="btn g" ${G.glory < d.cost ? 'disabled' : ''} onclick="buyDec('${d.id}')">Promulguer</button>`}</div></div>`; }).join('')}
  <div class="card vio"><h3>📣 Réforme de propagande</h3><div class="sub">Répétable à l'infini. Chaque réforme : revenus +5 % (actuellement ${G.refs} → +${G.refs * 5} %).</div><div class="row"><span class="small">Coût : <b>${num(rc)} Gloire</b>${G.glory < rc ? `<div class="need">Il manque ${num(rc - G.glory)} Gloire</div>` : ''}</span><button class="btn v" ${G.glory < rc ? 'disabled' : ''} onclick="buyReform()">Promulguer</button></div></div></div>`;
}
function pBanque() {
  const lim = borrowLimit(), dem = echDemand(), tl = echTurn() - G.turn;
  return `<div class="grid">
   <div class="card"><h3>🏦 Banque Universelle des Dettes Perpétuelles</h3><div class="sub">« Nous prêtons aux riches, et aux autres quand ils deviennent riches. »</div>
    <div class="row"><span>Dette</span><b class="${G.debt ? 'neg' : ''}">${money(G.debt)}</b></div>
    <div class="row"><span>Plafond autorisé</span><b>${money(lim)}</b></div>
    <div class="row"><span>Taux</span><b>${(rate() * 100).toFixed(1)} % / trimestre${G.rateT ? ` (encore ${G.rateT}t)` : ''}</b></div>
    <div class="seg"><button class="btn sm" onclick="borrow(.25)">Emprunter 25 %</button><button class="btn sm" onclick="borrow('max')">Max</button><button class="btn w sm" onclick="repay(.5)">Rembourser 50 %</button><button class="btn w sm" onclick="repay('all')">Tout</button></div>
    <div class="small">Emprunter accélère le début de partie, mais les intérêts tombent même en mauvais trimestre. Si votre trésor passe sous zéro : actions bradées, puis découvert, puis faillite.</div></div>
   <div class="card"><h3>⏳ Échéance n°${G.ech + 1}</h3><div class="sub">Le Conseil Mondial vient chercher son tribut.</div>
    <div class="row"><span>Tribut</span><b>${money(dem)}</b></div><div class="row"><span>Dans</span><b>${tl} trimestre(s)</b></div><div class="row"><span>Suivante</span><b>${money(echDemand(G.ech + 2))}</b></div>
    <div class="small">Le tribut est prélevé sur votre trésor, puis sur vos actions, puis sur votre découvert autorisé. Impossible à payer = fin du règne.</div></div>
   <div class="card"><h3>⚖ Cabinet Talleyrand &amp; Associés</h3><div class="sub">« Nous avons trahi tous les régimes. Pourquoi pas le vôtre ? »</div>
    <div class="small">Radar : <b>${Math.round(G.heat)}/100</b>. À 100, procès (amende ≈ 30 % de vos liquidités et titres). Deuxième procès : exil, fin du règne.</div>
    <div class="seg"><button class="btn" onclick="lawyer()" ${G.cash < lawyerCost() ? 'disabled' : ''}>« Clarifier le dossier » · −${num(lawyerCost())} ⚜ · Radar −20</button></div>
    <div class="small">Autres moyens : Ministère de la Légitimité, politique « Bien-être », décret Code Civil 2.0, patience (−2/trim.).</div></div>
  </div>`;
}
function pJournal() {
  return `<div class="card log">${G.log.map(l => `<p><span class="t">T${l.turn}</span>${l.t}</p>`).join('')}</div>`;
}

/* ---------- Raccourcis & démarrage ---------- */
document.addEventListener('keydown', e => {
  if (!G || $('#modal').innerHTML) return;
  if (e.code === 'Space' && document.activeElement === document.body) { e.preventDefault(); advance(1); }
  if (e.key === 'a' || e.key === 'A') toggleAuto();
  const k = parseInt(e.key); if (k >= 1 && k <= 6) setTab(['empire', 'conq', 'bourse', 'decrets', 'banque', 'journal'][k - 1]);
});
const THEME_KEY = 'empire2736-theme';
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); const b = $('#tbtn'); if (b) b.textContent = t === 'dark' ? '☀' : '🌙'; }
function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; lsSet(THEME_KEY, t); applyTheme(t); }
applyTheme(lsGet(THEME_KEY) === 'dark' ? 'dark' : 'light');
loadMeta();
newGame();
startScreen();
</script>
</body>
